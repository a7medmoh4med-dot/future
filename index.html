<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#030305">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Future">
<title>Future</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="future-cloud.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#030305;--glass:rgba(255,255,255,.055);--glass2:rgba(255,255,255,.085);
  --stroke:rgba(255,255,255,.08);--stroke2:rgba(255,255,255,.14);
  --text:#F5F5F7;--muted:#8E8E98;--dim:#5E5E68;
  --green:#2EE59D;--green2:#10B981;--amber:#FFB547;--red:#FF6B5E;--violet:#9C8CFF;--out:#F09D92;--mov:#93A4FF;
  --r:28px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:-25%;z-index:-1;pointer-events:none;
  background:
    radial-gradient(38% 30% at 12% 8%,rgba(46,229,157,.17),transparent 70%),
    radial-gradient(34% 28% at 92% 16%,rgba(124,140,255,.17),transparent 70%),
    radial-gradient(40% 32% at 70% 98%,rgba(181,124,255,.12),transparent 70%),
    radial-gradient(30% 24% at 5% 80%,rgba(255,181,71,.06),transparent 70%);}
button{font-family:inherit;color:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}

#app{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 6px) 16px calc(env(safe-area-inset-bottom) + 116px)}
#hdr{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top) + 8px) 4px 14px;margin:calc(-1 * env(safe-area-inset-top) - 6px) -4px 4px;
  background:linear-gradient(180deg,rgba(3,3,5,.92) 55%,rgba(3,3,5,0));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:11px}
.logo{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;
  background:linear-gradient(140deg,#2EE59D,#0E9F74 55%,#6C5CE7);box-shadow:0 8px 24px rgba(46,229,157,.25),inset 0 1px 0 rgba(255,255,255,.35)}
.logo svg{width:22px;height:22px}
.wordmark{font-weight:800;font-size:20px;letter-spacing:-.03em;line-height:1}
.mnav{display:flex;align-items:center;gap:4px;margin-top:3px;white-space:nowrap;color:var(--muted);font-size:13px;font-weight:600}
.mnav button{border:0;background:none;color:var(--muted);font-size:17px;padding:0 6px;line-height:1}
.mnav button:disabled{opacity:.25}
.pill{display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;font-size:12px;font-weight:600;
  background:var(--glass);border:1px solid var(--stroke);color:var(--muted);white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.pill.green i{background:var(--green);box-shadow:0 0 10px var(--green)}
.pill.amber i{background:var(--amber);box-shadow:0 0 10px var(--amber)}
.pill.red i{background:var(--red)}

.card{position:relative;border-radius:var(--r);padding:20px;margin-bottom:14px;
  background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.028));
  border:1px solid var(--stroke);backdrop-filter:blur(26px) saturate(150%);-webkit-backdrop-filter:blur(26px) saturate(150%);
  box-shadow:0 24px 60px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06)}
.card.tight{padding:16px}
.anim .card,.anim .stag{animation:rise .65s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 55ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
.h-label{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.01em}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:22px 4px 10px;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.sec-title small{text-transform:none;letter-spacing:0;font-weight:600}

/* hero */
.hero{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hero .big{font-size:44px;font-weight:800;letter-spacing:-.045em;line-height:1.02;margin:6px 0 4px}
.hero .big small{font-size:24px;font-weight:700;color:var(--muted);letter-spacing:-.02em}
.hero .sub{font-size:13px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:18px}
.stat{padding:11px 12px;border-radius:18px;background:rgba(255,255,255,.04);border:1px solid var(--stroke)}
.stat b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px;font-weight:700;margin-top:3px;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--muted);font-weight:600}

.ring{width:124px;height:124px;flex:none}
.ring circle{fill:none;stroke-width:12}
.ring .trk{stroke:rgba(255,255,255,.07)}
.ring .prog{stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;stroke-dasharray:var(--c);stroke-dashoffset:var(--off)}
.anim .ring .prog{animation:ringfill 1.3s cubic-bezier(.2,.8,.2,1) both}
@keyframes ringfill{from{stroke-dashoffset:var(--c)}}
.ring text{fill:var(--text);font-family:var(--font);text-anchor:middle}

/* ask button */
.ask{position:relative;overflow:hidden;width:100%;border:0;border-radius:26px;padding:20px 20px;margin-bottom:14px;
  display:flex;align-items:center;gap:15px;text-align:left;
  background:linear-gradient(135deg,#3BF0A8 0%,#14C084 45%,#0C8C66 100%);color:#03140D;
  box-shadow:0 20px 44px rgba(46,229,157,.28),inset 0 1px 0 rgba(255,255,255,.45);transition:transform .18s}
.ask:active{transform:scale(.98)}
.ask .q{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;background:rgba(0,0,0,.14);font-size:26px;font-weight:900;flex:none}
.ask b{display:block;font-size:20px;font-weight:800;letter-spacing:-.03em}
.ask span{font-size:13px;font-weight:600;opacity:.75}
.ask::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-18deg);animation:shine 4.5s ease-in-out infinite}
@keyframes shine{0%,70%{left:-60%}100%{left:130%}}

/* budget rows */
.brow{display:flex;gap:13px;align-items:center;padding:12px 2px}
.brow+.brow{border-top:1px solid rgba(255,255,255,.05)}
.bico{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:20px;flex:none;
  background:color-mix(in srgb,var(--c) 22%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 35%,transparent)}
.bmain{flex:1;min-width:0}
.bline{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.bname{font-weight:650;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bleft{font-weight:700;font-size:15px;white-space:nowrap}
.bleft small{color:var(--muted);font-weight:500;font-size:12px}
.bar{height:7px;border-radius:9px;background:rgba(255,255,255,.07);margin:8px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;transform-origin:left center}
.anim .bar i{animation:barfill 1.1s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 45ms + 150ms)}
@keyframes barfill{from{transform:scaleX(0)}}
.bsub{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:500}
.lock{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--dim);margin-left:6px}
.g{color:var(--green)}.a{color:var(--amber)}.r{color:var(--red)}.m{color:var(--muted)}.o{color:var(--out)}.v{color:var(--mov)}
.num.g,.amt.g{color:var(--green)!important}.num.o,.amt.o{color:var(--out)!important}.num.v,.amt.v{color:var(--mov)!important}.num.r,.amt.r{color:var(--red)!important}.num.a,.amt.a{color:var(--amber)!important}

/* banners */
.banner{display:flex;gap:12px;align-items:flex-start;border-radius:22px;padding:14px 16px;margin-bottom:14px;font-size:13.5px;line-height:1.4;
  border:1px solid var(--stroke2);background:rgba(255,255,255,.05)}
.banner.amber{background:rgba(255,181,71,.09);border-color:rgba(255,181,71,.28)}
.banner.red{background:rgba(255,107,94,.1);border-color:rgba(255,107,94,.32)}
.banner.green{background:rgba(46,229,157,.08);border-color:rgba(46,229,157,.28)}
.banner .ic{font-size:20px;line-height:1}
.banner b{display:block;font-size:14px;margin-bottom:2px}
.banner .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.ovw{display:grid;gap:8px;margin:8px 0 6px}.ovr{background:rgba(0,0,0,.2);border-radius:14px;padding:10px 12px}
.ovh{display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:14px}.banner .ovh b{display:inline;margin:0;white-space:nowrap}
.ovs{font-size:12.5px;color:var(--muted);margin-top:3px}.ovy{font-size:13px;margin-top:6px}.ovy .m{color:var(--muted)}.ovn{font-size:13px;color:var(--muted)}

/* buttons */
.btn{border:0;border-radius:18px;padding:15px 18px;font-weight:700;font-size:15.5px;width:100%;margin-top:10px;
  background:rgba(255,255,255,.08);border:1px solid var(--stroke2);transition:transform .15s,opacity .15s}
.btn:active{transform:scale(.98)}
.btn.primary{background:linear-gradient(135deg,#3BF0A8,#12B981);color:#03140D;border:0;box-shadow:0 12px 30px rgba(46,229,157,.25)}
.btn.amber{background:linear-gradient(135deg,#FFC870,#FF9F2E);color:#2A1700;border:0}
.btn.danger{background:rgba(255,107,94,.12);color:var(--red);border-color:rgba(255,107,94,.35)}
.btn.ghost{background:transparent}
.btn.sm{width:auto;padding:9px 14px;font-size:13px;border-radius:14px;margin-top:0}
.btn:disabled{opacity:.4}
.chipbtn{border:1px solid var(--stroke2);background:rgba(255,255,255,.06);border-radius:999px;padding:8px 13px;font-size:13px;font-weight:600}

/* tx list */
.toolbar{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.toolbar::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--stroke2);background:rgba(255,255,255,.05);color:var(--muted);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:650}
.chip.on{background:#fff;color:#000;border-color:#fff}
.search{width:100%;border:1px solid var(--stroke2);background:rgba(255,255,255,.05);color:var(--text);border-radius:16px;padding:12px 14px;font-size:16px;margin-bottom:12px;outline:none}
.day{font-size:12px;font-weight:700;color:var(--muted);margin:14px 6px 6px;text-transform:uppercase;letter-spacing:.06em}
.txr{display:flex;align-items:center;gap:12px;padding:11px 4px;border-radius:16px;cursor:pointer}
.txr+.txr{border-top:1px solid rgba(255,255,255,.05)}
[data-act="edit-tx"]{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.txr .t1{font-weight:650;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txr .t2{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txr .amt{margin-left:auto;font-weight:700;font-size:15px;white-space:nowrap;text-align:right}
.txr .amt small{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.who{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:6px;font-size:12px;font-weight:800;color:#000;margin-right:5px;vertical-align:-3px}
.empty{text-align:center;color:var(--muted);padding:34px 10px;font-size:14px}
.empty .e{font-size:38px;margin-bottom:8px}

.fab{position:fixed;right:max(18px,calc(50% - 242px));bottom:calc(env(safe-area-inset-bottom) + 98px);width:60px;height:60px;border-radius:21px;border:0;z-index:45;
  background:linear-gradient(140deg,#fff,#d9d9e0);color:#000;font-size:32px;font-weight:300;line-height:1;
  box-shadow:0 16px 36px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.4)}
.fab:active{transform:scale(.94)}

/* tabbar */
#tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 12px);width:min(496px,calc(100% - 24px));
  display:flex;padding:7px;border-radius:30px;z-index:50;
  background:rgba(18,18,24,.74);backdrop-filter:blur(30px) saturate(170%);-webkit-backdrop-filter:blur(30px) saturate(170%);
  border:1px solid var(--stroke2);box-shadow:0 22px 60px rgba(0,0,0,.65)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 7px;border:0;background:none;border-radius:22px;color:var(--muted);font-size:10.5px;font-weight:650;transition:background .2s,color .2s}
.tab svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:#fff;background:rgba(255,255,255,.09)}
.tab.on svg{stroke:var(--green);filter:drop-shadow(0 0 8px rgba(46,229,157,.5))}

/* sheets */
#sheets .wrap{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center}
#sheets .bd{position:absolute;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;transition:opacity .3s}
#sheets .sheet{position:relative;width:min(560px,100%);max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  border-radius:32px 32px 0 0;padding:10px 20px calc(env(safe-area-inset-bottom) + 24px);
  background:linear-gradient(180deg,rgba(32,32,40,.96),rgba(14,14,19,.98));border:1px solid var(--stroke2);border-bottom:0;
  box-shadow:0 -30px 80px rgba(0,0,0,.6);transform:translateY(105%);transition:transform .42s cubic-bezier(.2,.9,.2,1)}
#sheets .wrap.open .bd{opacity:1}
#sheets .wrap.open .sheet{transform:none}
.grab{width:42px;height:5px;border-radius:5px;background:rgba(255,255,255,.2);margin:4px auto 14px}
.sh-title{font-size:24px;font-weight:800;letter-spacing:-.03em;margin:0 0 4px}
.sh-sub{color:var(--muted);font-size:14px;margin:0 0 16px;line-height:1.4}
.x{position:absolute;right:16px;top:16px;width:34px;height:34px;border-radius:12px;border:0;background:rgba(255,255,255,.08);font-size:18px;color:var(--muted)}
.fld{display:block;margin-bottom:14px}
.fld>span{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:0 0 7px 4px;text-transform:uppercase;letter-spacing:.06em}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--stroke2);background:rgba(255,255,255,.05);color:var(--text);border-radius:16px;padding:13px 14px;font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:rgba(46,229,157,.6);box-shadow:0 0 0 4px rgba(46,229,157,.12)}
.fld select{background-image:linear-gradient(45deg,transparent 50%,#888 50%),linear-gradient(135deg,#888 50%,transparent 50%);background-position:calc(100% - 20px) 55%,calc(100% - 14px) 55%;background-size:6px 6px;background-repeat:no-repeat}
.fld textarea{min-height:120px;font-size:13px;font-family:ui-monospace,Menlo,monospace}
.amtin{display:flex;align-items:center;gap:8px;border:1px solid var(--stroke2);background:rgba(255,255,255,.05);border-radius:20px;padding:6px 16px}
.amtin input{border:0!important;background:none!important;box-shadow:none!important;font-size:40px!important;font-weight:800;letter-spacing:-.04em;padding:6px 0!important}
.amtin b{font-size:28px;color:var(--muted);font-weight:700}
.amtin.sm{border-radius:16px;padding:2px 14px}.amtin.sm input{font-size:20px!important;font-weight:700;letter-spacing:-.01em}.amtin.sm b{font-size:16px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;padding:4px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid var(--stroke)}
.seg button{flex:1;border:0;background:none;padding:10px 6px;border-radius:12px;font-size:14px;font-weight:650;color:var(--muted)}
.seg button.on{background:#fff;color:#000;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cat{border:1px solid var(--stroke);background:rgba(255,255,255,.04);border-radius:16px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--muted);text-align:center;line-height:1.15}
.cat .e{font-size:20px}
.cat.on{border-color:var(--c,#fff);background:color-mix(in srgb,var(--c,#fff) 18%,transparent);color:#fff}
.cat small{font-size:10.5px;opacity:.8;font-weight:600}
.check{display:flex;align-items:center;gap:10px;font-size:14px;margin:4px 2px 14px;color:var(--muted)}
.check input{width:20px;height:20px;accent-color:var(--green)}
.check.two{align-items:flex-start;color:var(--text);margin-bottom:10px}
.check.two input{flex:none;margin-top:1px}
.check.two small{display:block;color:var(--muted);font-size:12.5px;font-weight:500;margin-top:3px;line-height:1.35}
.auch{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}.auch .badge{font-size:12px;padding:3px 8px}
.lnk{color:var(--mov);font-weight:700;cursor:pointer;white-space:nowrap}

/* verdict */
.verdict{margin-top:18px;border-radius:26px;padding:22px 20px;text-align:center;position:relative;overflow:hidden;animation:pop .55s cubic-bezier(.2,1.3,.3,1) both}
.verdict::before{content:"";position:absolute;inset:-40%;background:radial-gradient(circle at 50% 30%,var(--vc),transparent 55%);opacity:.22}
.verdict>*{position:relative}
.v-yes{--vc:#2EE59D;background:rgba(46,229,157,.08);border:1px solid rgba(46,229,157,.35)}
.v-no{--vc:#FF6B5E;background:rgba(255,107,94,.08);border:1px solid rgba(255,107,94,.38)}
.v-wait{--vc:#FFB547;background:rgba(255,181,71,.08);border:1px solid rgba(255,181,71,.38)}
.v-no{animation:pop .55s cubic-bezier(.2,1.3,.3,1) both,shake .5s .45s}
.vbadge{width:74px;height:74px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;font-size:36px;font-weight:900;color:#000;background:var(--vc);box-shadow:0 0 0 10px color-mix(in srgb,var(--vc) 18%,transparent),0 0 50px var(--vc)}
.vtitle{font-size:34px;font-weight:900;letter-spacing:-.04em;color:var(--vc)}
.vmsg{font-size:15px;line-height:1.45;margin-top:6px;color:#e9e9ee}
.vrule{margin-top:12px;padding:12px 14px;border-radius:16px;background:rgba(0,0,0,.25);font-size:14px;text-align:left;line-height:1.4}
.vrule b{color:var(--vc)}
.vacts{margin-top:8px}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}

/* waits */
.wait{display:flex;align-items:center;gap:12px}
.wait .tm{font-size:12px;color:var(--amber);font-weight:700;margin-top:2px}
.wait .acts{display:flex;gap:6px;margin-left:auto}
@media (max-width:959px){.hw-todo .wait{gap:10px}.hw-todo .wait .t1{font-size:15px;line-height:1.25}.hw-todo .wait .acts .btn.sm{padding:9px 12px}.hw-todo .wait .acts .btn.ghost{padding:9px 10px}}
.wait .tm .ok{color:var(--green)}.wait .tm .no{color:var(--red)}.wait .tm .mu{color:var(--muted);font-weight:600}
.me{width:34px;height:34px;border-radius:12px;border:1px solid var(--stroke2);display:grid;place-items:center;font-weight:800;font-size:14px;color:#000;padding:0;font-family:inherit}
.me.none{background:var(--glass);color:var(--muted);font-size:15px}
.tab{position:relative}
.tab .dot{position:absolute;top:5px;left:calc(50% + 7px);width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px #121218}
.people{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 8px}
.person{border:1px solid var(--stroke2);background:var(--glass);border-radius:22px;padding:18px 10px 14px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--text);font-weight:750;font-size:16px;font-family:inherit}
.person small{font-size:11.5px;color:var(--muted);font-weight:600}
.person.on{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}
.pav{width:52px;height:52px;border-radius:17px;display:grid;place-items:center;font-size:22px;font-weight:800;color:#000;flex:0 0 auto}
.ask-hd{display:flex;align-items:center;gap:12px;margin:0 40px 6px 0}
.ask-hd .pav{width:44px;height:44px;border-radius:14px;font-size:19px}
.ask-amt{font-size:44px;font-weight:800;letter-spacing:-.03em;margin:16px 0 0}
.ask-desc{font-size:17px;font-weight:650;margin:2px 0 12px}
.lrow{display:flex;align-items:center;gap:12px;padding:11px 2px;cursor:pointer}
.lrow+.lrow{border-top:1px solid rgba(255,255,255,.05)}
.flag{display:inline-block;font-size:12px;font-weight:700;padding:2px 7px;border-radius:999px;margin:2px 4px 0 0;background:rgba(255,107,94,.15);color:var(--red)}
.flag.a{background:rgba(255,181,71,.15);color:var(--amber)}
.plan{margin-top:12px;padding:12px 14px;border-radius:18px;background:rgba(255,255,255,.035);border:1px solid var(--stroke)}
.plan .ph{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:700}
.plan .pr{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);padding:3px 0}
.plan .pr b,.plan .pr .num{color:var(--text);font-weight:650;white-space:nowrap}
.plan .pr.tot{border-top:1px solid var(--stroke);margin-top:4px;padding-top:7px;color:var(--text);font-weight:700}
.plan .pv{margin-top:8px;font-weight:700;font-size:14px;line-height:1.35}
.plan .pv.g{color:var(--green)}.plan .pv.r{color:var(--red)}
.pinin{letter-spacing:.5em;text-align:center;font-size:26px!important;font-weight:800}

/* table */
.trow{display:grid;grid-template-columns:minmax(0,1.75fr) .8fr .7fr .8fr;gap:6px;align-items:center;padding:10px 2px;font-size:13.5px}
.trow+.trow{border-top:1px solid rgba(255,255,255,.05)}
.trow.h{color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.trow span:not(:first-child){text-align:right}
.trow .nm{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* goals */
.goal .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.goal .gt{font-size:17px;font-weight:750;letter-spacing:-.02em}
.goal .gs{font-size:12.5px;color:var(--muted);margin-top:2px}
.goal .gv{font-size:30px;font-weight:800;letter-spacing:-.04em;margin:12px 0 2px}
.goal .gd{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-weight:600}
.gbar{height:10px;border-radius:10px;background:rgba(255,255,255,.07);overflow:hidden;margin:10px 0 8px}
.gbar i{display:block;height:100%;border-radius:10px;transform-origin:left}
.anim .gbar i{animation:barfill 1.3s cubic-bezier(.2,.8,.2,1) both .2s}
.badge{display:inline-block;padding:5px 10px;border-radius:999px;font-size:11.5px;font-weight:700;background:rgba(255,255,255,.07);border:1px solid var(--stroke2);white-space:nowrap}
.badge.g{background:rgba(46,229,157,.12);border-color:rgba(46,229,157,.35);color:var(--green)}
.badge.a{background:rgba(255,181,71,.12);border-color:rgba(255,181,71,.35);color:var(--amber)}
.steps{display:flex;flex-direction:column;gap:0}
.step{display:flex;gap:12px;align-items:center;padding:9px 0}
.step .dot{width:28px;height:28px;border-radius:10px;display:grid;place-items:center;font-size:13px;font-weight:800;background:rgba(255,255,255,.08);flex:none}
.step.done .dot{background:var(--green);color:#000}
.step .sl{flex:1;font-size:14px;font-weight:600}
.step .sd{font-size:12.5px;color:var(--muted);font-weight:600}

/* rules */
.rule{display:flex;gap:14px;align-items:flex-start;padding:13px 2px;cursor:pointer}
.rule+.rule{border-top:1px solid rgba(255,255,255,.05)}
.rule .n{width:34px;height:34px;border-radius:12px;flex:none;display:grid;place-items:center;font-weight:900;font-size:15px;
  background:linear-gradient(140deg,rgba(46,229,157,.25),rgba(124,140,255,.2));border:1px solid rgba(255,255,255,.12)}
.rule .rt{font-size:14.5px;font-weight:600;line-height:1.38}
.rule .rk{font-size:11.5px;color:var(--muted);margin-top:4px}
.rule.off{opacity:.45}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 2px;cursor:pointer;font-size:15px;font-weight:600}
.setrow+.setrow{border-top:1px solid rgba(255,255,255,.05)}
.setrow small{color:var(--muted);font-weight:500;font-size:13px}
.setrow .chev{color:var(--dim);font-size:20px}
.edrow{display:grid;grid-template-columns:1fr 100px 46px;gap:8px;align-items:center;margin-bottom:8px}
.edrow input{width:100%;border:1px solid var(--stroke2);background:rgba(255,255,255,.05);color:var(--text);border-radius:13px;padding:11px 12px;font-size:16px;outline:none}

/* charts */
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--font);fill:var(--muted);font-size:12px;font-weight:600}
.anim .chart .cb{animation:grow 1s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i) * 80ms + 150ms);transform-box:fill-box;transform-origin:bottom}
@keyframes grow{from{transform:scaleY(0)}}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:12px;font-size:12px;color:var(--muted);font-weight:600}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:0}

#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translate(-50%,-140%);z-index:200;
  padding:12px 18px;border-radius:18px;font-size:14px;font-weight:650;background:rgba(30,30,38,.92);border:1px solid var(--stroke2);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 18px 40px rgba(0,0,0,.5);transition:transform .45s cubic-bezier(.2,.9,.2,1);max-width:90vw;text-align:center}
#toast.show{transform:translate(-50%,0)}
.loading{display:grid;place-items:center;min-height:60vh;color:var(--muted);gap:14px;text-align:center}
.spin{width:36px;height:36px;border-radius:50%;border:3px solid rgba(255,255,255,.1);border-top-color:var(--green);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.muted{color:var(--muted)}
.mt0{margin-top:0}

/* close & cushion */
.avz{display:flex;align-items:center;gap:10px;margin-top:12px;padding:11px 13px;border-radius:16px;background:rgba(46,229,157,.07);border:1px solid rgba(46,229,157,.2);font-size:13px;line-height:1.35;cursor:pointer}
.avz.neg{background:rgba(255,107,94,.08);border-color:rgba(255,107,94,.28)}
.avz b{white-space:nowrap}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.pills span{padding:6px 10px;border-radius:999px;font-size:12.5px;font-weight:650;background:rgba(255,255,255,.06);border:1px solid var(--stroke)}
.pills span.r{color:var(--red);border-color:rgba(255,107,94,.35)}
.prow{display:flex;align-items:center;gap:12px;padding:12px 2px}
.prow+.prow{border-top:1px solid rgba(255,255,255,.05)}
.prow .pl{flex:1;font-size:14.5px;font-weight:600;line-height:1.35}
.prow .pl small{display:block;color:var(--muted);font-weight:500;font-size:12.5px;margin-top:2px}
.prow .pv{font-weight:800;font-size:16px;white-space:nowrap}
/* faq */
.faq+.faq{border-top:1px solid rgba(255,255,255,.05)}
.faq summary{list-style:none;cursor:pointer;padding:13px 30px 13px 2px;font-weight:650;font-size:15px;line-height:1.35;position:relative}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";position:absolute;right:4px;top:9px;font-size:22px;font-weight:400;color:var(--muted);transition:transform .25s}
.faq[open] summary::after{transform:rotate(45deg);color:var(--green)}
.fa{font-size:14px;line-height:1.55;color:#c9c9d2;padding:0 2px 14px}
.fa b{color:#fff}
.fa ol,.fa ul{margin:6px 0 0;padding-left:20px}
.fa li{margin:3px 0}
/* editors */
.tg{border:1px solid var(--stroke2);background:rgba(255,255,255,.05);border-radius:13px;height:44px;min-width:42px;font-size:16px;color:var(--text)}
.tg.on{background:rgba(255,181,71,.15);border-color:rgba(255,181,71,.4)}
.plain{width:100%;border:1px solid var(--stroke2);background:rgba(255,255,255,.05);color:var(--text);border-radius:13px;padding:11px 12px;font-size:16px;outline:none}
.plain:disabled{opacity:.6}
.edrow4{display:grid;grid-template-columns:46px minmax(0,1fr) 76px 42px 42px;gap:6px;align-items:center;margin-bottom:8px}
.edrow4 input{width:100%;border:1px solid var(--stroke2);background:rgba(255,255,255,.05);color:var(--text);border-radius:13px;padding:11px 10px;font-size:16px;outline:none}
.edrow4 .em{text-align:center;padding:11px 4px}
.edrow3{display:grid;grid-template-columns:minmax(0,1fr) 42px 42px;gap:6px;align-items:center;margin-bottom:8px}
.bar{display:flex}
.bar i.pd{opacity:.38;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.35) 0 4px,transparent 4px 8px)!important;border-radius:0 9px 9px 0}
/* balances */
.acc{display:flex;align-items:center;gap:12px;padding:11px 2px;cursor:pointer}
.acc+.acc{border-top:1px solid rgba(255,255,255,.05)}
.acc .an{font-weight:650;font-size:15px}
.acc .as{font-size:12px;color:var(--muted);margin-top:2px}
.acc .av{margin-left:auto;font-weight:750;font-size:16px;white-space:nowrap}
.acc.hid .an,.acc.hid .av{color:var(--dim)}
.eye{width:38px;height:38px;border-radius:12px;border:1px solid var(--stroke);background:rgba(255,255,255,.05);font-size:16px;flex:none;display:grid;place-items:center}
.eye svg{width:19px;height:19px;fill:none;stroke:var(--muted);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tot{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:6px}
.tot .big2{font-size:32px;font-weight:800;letter-spacing:-.04em;line-height:1}
.accard{border-radius:22px;padding:16px;margin-bottom:10px;background:rgba(255,255,255,.04);border:1px solid var(--stroke)}
.accard.hid{opacity:.55}
.mini{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0 4px}
/* help, suggestions, todo, intro */
.hright{display:flex;align-items:center;gap:8px}
.hbtn{width:34px;height:34px;border-radius:12px;border:1px solid var(--stroke);background:var(--glass);color:var(--text);font-weight:800;font-size:15px}
.sugg{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;margin:-6px 0 14px;scrollbar-width:none}
.sugg:empty{display:none}
.sugg::-webkit-scrollbar{display:none}
.sg{flex:none;display:flex;align-items:center;gap:7px;border:1px solid var(--stroke2);background:rgba(255,255,255,.07);border-radius:14px;padding:9px 12px;font-size:13.5px;font-weight:650;white-space:nowrap;animation:pop .3s both}
.sg small{color:var(--muted);font-weight:600;font-size:11.5px}
.todo{display:flex;align-items:center;gap:12px;padding:11px 2px;cursor:pointer}
.todo+.todo{border-top:1px solid rgba(255,255,255,.05)}
.todo .ck{width:28px;height:28px;border-radius:10px;border:2px solid var(--stroke2);display:grid;place-items:center;font-size:14px;font-weight:900;flex:none;color:var(--muted)}
.todo.done .ck{background:var(--green);border-color:var(--green);color:#000}
.todo .tl{font-weight:650;font-size:15px}
.todo.done .tl{color:var(--muted);text-decoration:line-through}
.todo .ts{font-size:12.5px;color:var(--muted);margin-top:2px}
.todo .go{margin-left:auto;color:var(--dim);font-size:20px}
#tour{position:fixed;inset:0;z-index:250;opacity:0;transition:opacity .25s}
#tour.open{opacity:1}
#tour .tr-hole{position:fixed;border-radius:20px;box-shadow:0 0 0 9999px rgba(0,0,0,.76),0 0 0 2px rgba(46,229,157,.95),0 0 26px 6px rgba(46,229,157,.35);transition:left .35s cubic-bezier(.2,.8,.2,1),top .35s cubic-bezier(.2,.8,.2,1),width .35s cubic-bezier(.2,.8,.2,1),height .35s cubic-bezier(.2,.8,.2,1);pointer-events:none}
#tour .tr-hole.none{left:50%;top:50%;width:0;height:0;box-shadow:0 0 0 9999px rgba(0,0,0,.82)}
#tour .tr-card{position:fixed;background:#18181d;border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:18px 18px 16px;box-shadow:0 24px 70px rgba(0,0,0,.7);transition:top .35s cubic-bezier(.2,.8,.2,1),left .35s cubic-bezier(.2,.8,.2,1);max-height:calc(100vh - 24px);overflow:auto}
#tour .tr-n{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
#tour h3{font-size:20px;font-weight:800;margin:4px 34px 6px 0;letter-spacing:-.02em}
#tour .tr-s{font-size:15px;line-height:1.45;margin:0;color:var(--text)}
#tour .tr-l{font-size:14px;line-height:1.5;color:#c9c9d2;margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.08)}
#tour .tr-l ul{margin:6px 0 4px;padding-left:18px}#tour .tr-l li{margin:3px 0}
#tour .tr-acts{display:flex;align-items:center;gap:8px;margin-top:14px}
#tour .tr-acts .btn{margin:0}
#tour .tr-x{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:var(--text);font-size:14px;cursor:pointer}
#intro{position:fixed;inset:0;z-index:150;display:flex;flex-direction:column;background:rgba(3,3,5,.97);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  padding:calc(env(safe-area-inset-top) + 14px) 0 calc(env(safe-area-inset-bottom) + 18px);opacity:0;transition:opacity .35s}
#intro.open{opacity:1}
#intro::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(50% 35% at 50% 20%,rgba(46,229,157,.18),transparent 70%),radial-gradient(40% 30% at 80% 85%,rgba(124,140,255,.14),transparent 70%)}
.in-top{display:flex;justify-content:flex-end;padding:0 18px;position:relative}
.in-skip{border:0;background:none;color:var(--muted);font-weight:650;font-size:15px;padding:8px}
.in-view{flex:1;min-height:0;overflow:hidden;position:relative}
.in-track{display:flex;height:100%;transition:transform .5s cubic-bezier(.2,.9,.2,1)}
.slide{flex:0 0 100%;width:100%;min-width:0;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 28px 20px;display:flex;flex-direction:column;align-items:center;text-align:center}
.slide>div{max-width:440px;width:100%;margin:auto 0}
.icbig{width:104px;height:104px;border-radius:34px;display:grid;place-items:center;font-size:50px;margin:0 auto 26px;
  background:linear-gradient(140deg,rgba(46,229,157,.35),rgba(124,140,255,.3));border:1px solid rgba(255,255,255,.18);box-shadow:0 20px 50px rgba(46,229,157,.18),inset 0 1px 0 rgba(255,255,255,.25)}
.slide h2{font-size:30px;font-weight:850;letter-spacing:-.035em;margin:0 0 12px;line-height:1.1}
.slide p{font-size:16px;line-height:1.55;color:#c9c9d2;margin:0 0 18px}
.slide p b{color:#fff}
.in-vis{margin:6px auto 0;text-align:left}
.vpills{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.vpill{padding:9px 14px;border-radius:999px;font-weight:800;font-size:13.5px}
.in-bot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 22px;position:relative}
.dots{display:flex;gap:7px}
.dots i{width:7px;height:7px;border-radius:7px;background:rgba(255,255,255,.2);transition:all .3s}
.dots i.on{width:22px;background:var(--green)}
.in-next{width:auto;margin:0;padding:15px 26px}
.in-acts{display:flex;flex-direction:column;gap:2px;width:100%}

  .grid2{display:grid;grid-template-columns:430px 1fr;gap:18px;align-items:start}
  .grid2b{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
  .fab{right:28px}
  #sheets .wrap{align-items:center}
  #sheets .sheet{border-radius:32px;border-bottom:1px solid var(--stroke2);max-height:88vh}
}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:14px}
.kpi{cursor:pointer;margin:0!important}
.kpi .kl{font-size:13px;color:var(--muted);font-weight:650}
.kpi .kv{font-size:38px;font-weight:850;letter-spacing:-.04em;line-height:1.05;margin:8px 0 6px;white-space:nowrap}
.kpi .kv.g{color:var(--green)}.kpi .kv.r{color:var(--red)}
.kpi .ks{font-size:13px;color:var(--muted);line-height:1.4}
.homebtns{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px;margin:2px 0 14px}
.mnav small.fut{font-size:10.5px;font-weight:700;color:#B57CFF;background:rgba(181,124,255,.14);padding:2px 7px;border-radius:99px;margin-left:4px;vertical-align:1px;letter-spacing:.02em}
.homebtns .ask{margin:0}.homebtns .btn{margin:0;height:auto;min-height:56px;font-size:16px}
.homewrap{display:flex;flex-direction:column}
@media (max-width:959px){.kpis{grid-template-columns:1fr;gap:10px;order:1}.kpi{padding:14px 18px!important}.kpi .kv{font-size:30px;margin:2px 0 3px}.kpi .ks{font-size:12.5px}.homebtns{order:2;grid-template-columns:1fr 1fr}.homebtns .ask{grid-column:1/-1}.hw-todo{order:3}.homebtns .ask span{display:none}.homebtns .ask{padding:16px}.homebtns .ask .q{width:40px;height:40px;font-size:22px}}
.txgrid{display:flex;flex-direction:column}

.txsum>div{flex:1;min-width:0}.txsum span{display:block;font-size:11.5px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.txsum b{display:block;font-size:17px;font-weight:800;white-space:nowrap;margin-top:2px}
.txsum .chev{flex:none;color:var(--muted);font-size:22px;display:block}
@media (max-width:440px){.txsum{gap:6px;padding:12px 12px!important}.txsum b{font-size:15px}}
.txline{display:flex;align-items:center;gap:10px;padding:13px 16px!important;cursor:pointer;margin-bottom:12px;font-weight:650;font-size:14.5px}
.txline small{color:var(--muted);font-weight:600;margin-left:auto;white-space:nowrap;font-size:13px}
.txside{order:-1}
@media (min-width:1100px){
  #app{max-width:1400px;padding-bottom:48px}

  .tab{flex:none;flex-direction:row;gap:8px;padding:9px 16px;font-size:13.5px;border-radius:15px}
  .tab svg{width:19px;height:19px}

  .grid2{grid-template-columns:480px minmax(0,1fr)}

  .txgrid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}
  .txside{order:2;position:sticky;top:84px}
  .txside .stats{grid-template-columns:1fr}
  .cats{grid-template-columns:repeat(6,minmax(0,1fr))}
  #sheets .sheet:has(.fld ~ .fld ~ .fld), #sheets .sheet:has(.cats){width:min(1080px,94vw);padding:14px 32px 28px}
  #sheets .sheet:has(.fld ~ .fld ~ .fld) .sc, #sheets .sheet:has(.cats) .sc,
  #sheets .sheet:has(.fld ~ .fld ~ .fld) .sc > div[id$="-body"], #sheets .sheet:has(.cats) .sc > div[id$="-body"]{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:22px;align-content:start}

/* ---------------- rules engine ---------------- */
function matchKw(text, kws) {

    let k = norm(k0).trim(); if (!k) continue;
    if (k[0] === '=') { k = k.slice(1); if (new RegExp('(^|[^a-z0-9])' + escRe(k) + '($|[^a-z0-9])').test(text)) return k0; }
    else if (k.includes(' ')) { if (text.includes(k)) return k0; }
    else if (new RegExp('(^|[^a-z0-9])' + escRe(k)).test(text)) return k0;
  }

}

  const text = norm(q.desc);
  for (const r of cfg().rules) {
    if ((q.skip || []).includes(r.n)) continue;
    if (r.until && r.until < t) continue;

  }
  const st = catStats(ym), b = st.find(x => x.k === q.cat);

    if (needWait) return {q, v: 'wait48', b, msg: `Spesa fuori budget sopra i 50 €: aspetti 48 ore${askTail()}.`};
    const after = (b.spent + q.a) / (b.eff || 1);
    if (q.need === 'rinv' && after > 0.8) return {q, v: 'next', b, after, msg: `Con questa spesa ${esc(b.n)} arriva al ${Math.round(after * 100)}%. È rinviabile: aspetta il mese prossimo.`};
    return {q, v: 'yes', b, remain: r2(b.left - q.a), msg: `Rientra nel budget. Su ${esc(b.n)} ti restano <b>${eur(b.left - q.a)}</b>.`};
  }

  }
  const msg = b.left > 0 ? `Sfori di <b>${eur(over)}</b>: su ${esc(b.n)} restano solo ${eur(b.left)}.` : `${esc(b.n)} è finita: sfori di <b>${eur(over)}</b>.`;

async function doImport(w) {
  let txt = $('#im-t', w).value.trim();
  const f = $('#im-f', w).files[0]; if (!txt && f) txt = await f.text();
  let o; try { o = JSON.parse(txt); } catch (e) { toast('JSON non valido'); return; }
  if (!o || !Array.isArray(o.tx)) { toast('Non sembra un backup di Future'); return; }
  if (!(await confirmSheet('Importare il backup?', `${o.tx.length} movimenti, ${(o.shifts || []).length} spostamenti.`, 'Importa'))) return;
  closeSheet(w); toast('Importo…');
  if ($('#im-cfg', w).checked && o.config) await saveConfig(o.config);
  let n = 0;
  for (const c of ['tx', 'shifts', 'waits']) for (const x of (o[c] || [])) {
    const id = String(x.id || newId()).replace(/[^A-Za-z0-9_\-.~:@+]/g, '').slice(0, 60) || newId();
    const ok = await put(c, id, stripId(NORM[c](id, x))); if (ok === false) { toast('Import interrotto'); return; } n++;
    if (B.kind === 'db' && !S.preview && n % 20 === 0) await sleep(250);
  }
  toast(`Importati ${n} elementi ✓`); S.anim = true; render();
}

    ['Una regola mi blocca, ma è un\u2019eccezione', 'Se la regola ha un\u2019eccezione (per esempio “Sostituisce qualcosa di rotto” sui vestiti), sotto il NO trovi il pulsante per rivalutare senza quella regola.'],
    ['E se è una spesa che non posso evitare?', 'Rientro a casa, medico, un guasto: è una <b>spesa straordinaria obbligata</b>. In <b>Posso comprarlo?</b> tocca <b>🧾 È una spesa straordinaria obbligata</b> (c\u2019è anche sotto ogni NO). Nessuna regola la blocca e niente 48 ore, ma serve il sì dell\u2019altra persona. Prima di chiedere vedi da dove escono i soldi e di quanto si spostano le date dei debiti. Dopo il sì tocchi <b>Procedi</b> in Home e registri quanto hai pagato davvero (non oltre l\u2019importo autorizzato).'],
    ['Da dove escono i soldi di una straordinaria?', 'Prima dal <b>cuscinetto</b> (se paghi dal conto corrente), il resto dai soldi che andrebbero ai debiti. <b>Mai dal fondo casa</b> e non pesa sul budget del mese. Il cuscinetto si ricarica con gli avanzi dei mesi dopo, prima che vadano ai debiti: per questo il piano di saldo conta l\u2019intera spesa.'],
    ['Perché non vedo Mutuo e le altre intoccabili?', 'Per non comprare per sbaglio “dal mutuo”, di base vedi solo le voci flessibili. Se ti serve, tocca <b>Mostra anche le voci intoccabili</b>.']
  ]],
  ['Account e partner', [
    ['Come funziona l’account?', 'Ognuno entra con <b>la sua email e la sua password</b>. Future sa già chi sei: niente PIN e niente scelte. I tuoi dati sono nel tuo spazio e li vedi solo tu (e il partner, se lo colleghi).'],
    ['Come collego il partner?', 'Tocca la tua iniziale in alto a destra → <b>Invita il partner</b> → <b>Condividi il link</b> (per esempio su WhatsApp). Il partner apre il link dal telefono, crea il suo account e siete collegati: vedete gli stessi conti in tempo reale.'],
    ['Cosa cambia con il partner collegato?', 'Le regole che richiedono il partner si accendono: fuori budget sopra 50 € (48 ore + il suo sì), prestiti e spese straordinarie. Senza partner queste richieste hanno subito il via libera (resta solo il timer di 48 ore).'],
    ['Come autorizza il partner una spesa?', 'Gli arriva una <b>notifica</b> (se le ha attivate) e la richiesta compare <b>in cima alla Home</b>. Tocca <b>Decidi</b>, sceglie <b>Sì, autorizzo</b> o <b>No</b> (con il motivo). Tu ricevi la risposta con una notifica.'],
    ['Cosa succede quando finiscono le 48 ore?', 'Se c’è il sì (o non c’è un partner) compare <b>Via libera</b> con <b>Procedi</b>: il budget fa l’ultimo controllo e registri la spesa. Se è no, la richiesta si chiude.'],
    ['Come attivo le notifiche?', 'Su iPhone l’app deve essere <b>installata sulla Home</b> (Safari → Condividi → Aggiungi alla schermata Home) e aperta dall’icona. Poi: iniziale in alto a destra → <b>Attiva le notifiche</b> → Consenti. Ognuno lo fa sul suo telefono.'],
    ['Il partner non risponde', 'Sulla richiesta in attesa tocca <b>🔔</b>: gli arriva un promemoria.'],
    ['Come scollego il partner?', 'Iniziale in alto a destra → <b>Scollega</b>. I dati restano nello spazio di chi l’ha creato.']
  ]],
  ['Prestiti', [
    ['Dove vedo i soldi che ho prestato?', 'Nei <b>Saldi</b>, riga <b>Soldi prestati</b>: il totale è fuori dal totale dei conti. Toccala per vedere ogni persona, quanto ti deve e la storia.'],
    ['Già prestato o nuovo prestito?', '<b>Già prestato</b>: soldi dati prima di usare Future. Vanno solo nel registro, i saldi di oggi non cambiano. <b>Nuovo prestito</b>: escono da un conto, dal Fuori budget (se non basta, da una voce flessibile) e serve il <b>sì del partner</b> (se collegato), senza attese di 48 ore.'],
    ['Quanto posso prestare?', 'Al massimo quello che resta questo mese in Fuori budget più le voci flessibili. Oltre è un NO (regola sui prestiti).'],
    ['Posso dire quando penso che mi renderà i soldi?', 'Sì: apri la persona e scrivi il <b>Rientro previsto</b>. Il piano debiti ti mostra “con i rientri alle date previste” quando saldi ogni debito. Non li conta come sicuri; se la data passa senza rientro, la persona diventa <b>In ritardo</b>.'],
    ['Quando qualcuno mi rende i soldi?', 'Apri la persona e tocca <b>Ha reso</b>. È un\u2019entrata fuori dal budget e senza la quota di {QN}: va ai debiti, e le date del piano si avvicinano da sole.'],
    ['Ho un debito con una persona: dove lo metto?', 'Prestiti → <b>Aggiungi prestito → Gli devo io</b> (oppure Obiettivi → Nuovo obiettivo → Verso una persona). Scrivi persona, importo e, se c\u2019è, la data per restituire. Niente rata e niente interessi: entra nel <b>piano debiti</b> in ordine con gli altri e l\u2019app tiene i soldi da parte. Quando paghi tocca <b>Ho restituito</b>, tutto o una parte.'],
    ['Tiene lo storico di quanto mi deve una persona?', 'Sì: Saldi → <b>Soldi prestati</b> → tocca la persona. In alto c\u2019è <b>Cosa ti deve</b>, diviso per motivo (per esempio l\u2019ADSL di papà, mese per mese, e quello che ti doveva già prima dell\u2019app), con quanto ha reso. Sotto c\u2019è la storia completa, riga per riga, con data e descrizione. Quando presti puoi scrivere <b>Per cosa</b>.'],
    ['Qualcuno mi ha reso dei soldi: come lo registro?', 'In due modi, con lo stesso risultato: <b>＋ Registra → Entrata → 🤝 Rientro prestito</b> e scegli <b>Da chi</b>, oppure Saldi → Soldi prestati → la persona → <b>Ha reso</b>. Quello che ti deve scende, nello storico compare “Ha reso”, niente quota a {QN} e i soldi vanno ai debiti. Se lo registri come “Altro” o “Entrate extra”, l\u2019app non sa che è un rientro.'],
    ['Pago io una bolletta di un altro: come la segno?', 'Crea un ricorrente (o modifica quello che c\u2019è) e scegli <b>A carico di</b> quella persona. Ogni mese la spesa conta nella sua voce del budget, perché i soldi escono davvero, e in più si somma a quello che quella persona ti deve. Se ti rende i soldi, <b>Ha reso</b>: vanno ai debiti.'],
    ['Cosa vuol dire “Chiede spesso”, “Non rende”, “In ritardo”?', '<b>Chiede spesso</b>: 2 o più prestiti in 6 mesi. <b>Non rende</b>: ti deve soldi e non rende niente da più di 3 mesi. <b>In ritardo</b>: è passata la data in cui aveva promesso di restituire. L\u2019avviso lo vedi tu quando inserisci il prestito e lo vede il partner prima di decidere.']
  ]],
  ['Registrare i movimenti', [
    ['Come registro una spesa?', 'Tocca <b>＋ Registra</b> in Home (o il <b>+</b> in Movimenti), scegli <b>Uscita</b>, scrivi importo e descrizione, scegli la voce e salva. Se sfora, l\u2019app ti chiede da dove coprire.'],
    ['Uscita, entrata o trasferimento?', '<b>Uscita</b>: una spesa. <b>Entrata</b>: stipendio e soldi in arrivo. <b>Trasferimento</b>: soldi che passano da un conto all\u2019altro, per esempio dal conto corrente al fondo casa. I trasferimenti non sono spese.'],
    ['Come funzionano i suggerimenti?', 'L\u2019app impara i nomi che usate. La seconda volta che scrivi le prime lettere (es. “Sup…”) ti propone <b>il nome completo</b> con la voce e il conto giusti. Se un movimento ha sempre lo stesso importo (iCloud 9,99 €) compila anche quello, altrimenti ti mostra “ultima: …”.'],
    ['Come modifico o elimino un movimento?', 'In <b>Movimenti</b> toccalo per modificarlo. <b>Tienilo premuto</b> (sul PC tasto destro) per le altre azioni: per un bonifico o un\u2019entrata segnati per sbaglio <b>↩︎ Rimetti in Da fare</b>, poi <b>Salta questo mese</b>, <b>Duplica</b> con la data di oggi, <b>Elimina</b>, e per le bollette <b>Pagata</b> o <b>Rimetti da pagare</b>. Le stesse azioni sono anche in fondo alla scheda di modifica.'],
    ['Cosa succede con le entrate extra?', 'Registrala come <b>Entrata</b> con un tipo segnato 💸 (Entrate extra, Tredicesima, Quattordicesima). Il budget del mese non cambia; il {QX} va a {QN} e il resto resta sul conto per i debiti: il piano lo conta subito e le date si avvicinano. I soldi che ti rendono si registrano da <b>Soldi prestati → Ha reso</b>, senza quota.'],
    ['Dove possono andare le entrate extra?', 'Finché ci sono debiti restano <b>sul conto per i debiti</b>: l\u2019app li conta nel piano di saldo. Chiusi i debiti vanno nel <b>fondo casa</b>. Puoi anche scegliere <b>Decido dopo</b>: restano in Home come “da destinare”.'],
    ['Come registro una busta paga con tredicesima o quattordicesima?', 'Entrata → <b>＋ Dividi in più voci</b>. Scrivi per esempio Stipendio 2.250 € e Tredicesima 2.000 €: il totale si calcola da solo e l\u2019app registra due entrate collegate. Così la tredicesima resta disponibile per “Pagata con la tredicesima” e la quattordicesima fa partire la regola 9. A dicembre e a luglio la seconda voce è già proposta. Se scrivi tutto insieme, l\u2019app ti chiede se dentro c\u2019è la tredicesima e la divide lei.'],
    ['Cos\u2019è “Pagata con la tredicesima”?', 'Se avete registrato una tredicesima, nelle uscite compare questa spunta: la spesa viene pagata da lì e resta <b>escluso dal budget del mese</b>, fino a esaurimento della tredicesima.'],
    ['Come verso nel fondo casa?', 'Finché ci sono debiti i versamenti sono fermi: la quota del mese resta sul conto come <b>salvadanaio debiti</b>. Chiuso l\u2019ultimo debito torna <b>Versa nel fondo</b> in Home e in Obiettivi, con la quota più tutte le rate liberate.'],
    ['Come funziona il cuscinetto?', 'È una somma che scegli tu, dentro il conto corrente, per i mesi scarsi, non soldi da spendere: “Puoi ancora spendere” guarda solo il budget flessibile e il piano debiti conta solo i soldi oltre il cuscinetto. Si usa solo alla chiusura di un mese in rosso (sforamenti o entrate sotto il budget), per una spesa straordinaria obbligata o a mano, e poi si ricarica con gli avanzi prima di mandare soldi ai debiti. In Home compare un avviso <b>giallo</b> quando il mese è sotto (con <b>Copri da una voce flessibile</b>) e uno <b>rosso</b> se, dopo i pagamenti del mese, sul conto restano meno dei 700 €.'],
    ['E per un\u2019entrata futura?', 'In <b>📉 Prevedi</b> scegli <b>Entrata</b> e il tipo: <b>Entrata extra</b> (toglie il {QX} di {QN}), <b>Rientro prestito</b> (scegli da chi, senza quota) o <b>Altro</b>. Vedi quanto arriva ai debiti, debito per debito quanto si anticipa, la nuova data di <b>Libero dai debiti</b>, quanto avanza per il fondo casa e quando arriva al traguardo. Se è in un mese futuro la puoi mettere come <b>entrata prevista</b>: conta nel piano e quel mese la trovi in Da fare con <b>Arrivata</b>.'],
    ['Come vedo quanto pesa una spesa sui debiti?', 'In Home tocca <b>📉 Prevedi</b>: scrivi importo, voce e quando (oggi o un mese nei prossimi 24). Vedi subito quanto copre la voce, quanto esce dai soldi per i debiti, debito per debito la data prima e dopo, e se cambia <b>Libero dai debiti</b>. Non registra niente: se vuoi, da lì la registri o la metti come prevista. La stessa riga compare anche nella risposta di <b>Posso comprarlo?</b>.'],
    ['Posso vedere i mesi futuri?', 'Sì: con la freccia <b>›</b> vai avanti fino a 24 mesi. Ogni mese futuro è una <b>previsione</b>: entrate previste (con tredicesima e quattordicesima nel loro mese), voci del budget, ricorrenti, cosa succede ai debiti e il <b>Da fare</b> di quel mese. Quando il piano chiude un finanziamento, dal mese dopo la sua rata sparisce e va ai debiti. Indietro si arriva al primo mese dell\u2019app.'],
    ['Come prevedo una spesa futura?', 'Vai nel mese con <b>›</b> e tocca <b>＋ Prevedi una spesa</b> (o registra con una data futura). La spesa entra nella sua voce: se non ci sta, sposti da un\u2019altra voce flessibile o la segni come sforamento, e lo sforamento esce dal salvadanaio debiti. Vedi subito se la data di fine debiti si sposta. Non tocca i saldi: quando arriva il giorno la trovi in Da fare con <b>Fatta</b> o ✕.'],
    ['E se la bolletta la pago più avanti?', 'Quando la registri sulla voce <b>Bollette</b> scegli <b>Da pagare</b> e la data di scadenza. Conta subito nel mese della bolletta, ma il conto scende solo quando in Da fare premi <b>Pagata</b>.'],
    ['Come cerco un movimento?', 'In <b>Movimenti</b> usa la ricerca e i filtri Tutti, Uscite, Entrate, Trasferimenti. Ogni movimento mostra voce, conto e chi l\u2019ha registrato.']
  ]],
  ['Fine mese e cuscinetto', [
    ['Cosa succede ai soldi non spesi a fine mese?', 'Nessun avanzo resta nelle voci: il mese dopo ogni voce riparte dal suo budget. La prima volta che aprite l\u2019app nel mese nuovo compare la <b>chiusura del mese</b>: quanto è avanzato, voce per voce, e dove va.'],
    ['Dove vanno gli avanzi?', 'Prima al <b>cuscinetto</b>, fino al tetto che hai scelto. Il resto resta sul conto per i debiti finché ce ne sono: l\u2019app lo conta nel piano di saldo. Chiusi i debiti, va nel fondo casa.'],
    ['Cos\u2019è il cuscinetto?', 'Una parte del <b>conto corrente</b> messa da parte, non un conto separato. Serve per i mesi con lo stipendio più basso, l\u2019assicurazione dell\u2019auto e i conguagli. Nei Saldi vedi “di cui cuscinetto” e quanto è davvero spendibile.'],
    ['Come uso il cuscinetto in un mese scarso?', 'Obiettivi → <b>Cuscinetto → Usa o ricarica</b> (o tocca la riga dell\u2019avanzo in Home): scrivi l\u2019importo e <b>Uso il cuscinetto</b>. Si ricarica da solo con gli avanzi dei mesi dopo.'],
    ['Perché la chiusura chiede il saldo della banca?', 'Per tenere il piano vero. Se in banca c\u2019è meno che nell\u2019app, la differenza sono spese non registrate: l\u2019app le registra e le toglie dagli avanzi. Se c\u2019è di più, lo registra come entrata non registrata senza contarlo negli avanzi. Il campo è facoltativo.'],
    ['E se il mese finisce sforato?', 'La chiusura propone di coprire lo sforamento con il cuscinetto. Se non basta ti dice quanto manca: il mese dopo vanno strette le voci flessibili.'],
    ['Posso chiudere un mese a mano?', 'Sì: Bilancio → torna al mese con le frecce ‹ › → <b>Chiudi [mese]</b>, oppure Obiettivi → Cuscinetto → <b>Chiusura mese</b>. Un mese si chiude una volta sola.'],
    ['Cosa vuol dire “Se il mese finisce così avanzano…”?', 'È una previsione prudente: considera le voci intoccabili come pagate per intero (sono impegni) e conta solo quello che resta nelle voci flessibili, meno eventuali sforamenti. Ti dice anche dove andrà alla chiusura: cuscinetto, estinzione, debito o fondo casa.']
  ]],
  ['Pagamenti ricorrenti', [
    ['Cosa sono?', 'Spese ed entrate che si ripetono ogni mese (affitto, bollette, abbonamenti, rate, stipendio). Le imposti una volta e nel budget contano subito come <b>previste</b>. Gli <b>addebiti automatici</b> (carta, abbonamenti, bollette) si registrano da soli il giorno stabilito. I <b>bonifici che fai tu</b> (mutuo, rate, condominio, quote) e le <b>entrate</b> restano in Home → <b>Da fare</b> finché non premi Fatto o Arrivata.'],
    ['Cosa c\u2019è in Da fare?', 'Solo le cose che devi fare tu, in ordine di data: i bonifici del mese (da inizio mese, rossi se in ritardo), le entrate dal giorno in cui sono attese, le bollette da pagare, le estinzioni del piano debiti nel loro mese, i prestiti con la data di rientro passata, le spese previste, il mese da chiudere, gli sforamenti e il backup. Gli addebiti automatici non ci sono: partono da soli.'],
    ['Come segno un bonifico come fatto?', 'In Home → Da fare tocca <b>Fatto</b>: ti chiede conferma con importo e data già scritti (la quota di {QN} con il suo {QF}), che puoi correggere. Se l\u2019hai segnato per sbaglio: Movimenti → tieni premuto → <b>↩︎ Rimetti in Da fare</b>. Se un mese non va pagato, la ✕ lo salta.'],
    ['Perché non posso cambiare il budget di Mutuo, Finanziamenti, Carta, Condominio e Utenze?', 'Perché è la somma dei loro pagamenti ricorrenti: l\u2019importo esiste in un posto solo. Cambi la rata nel ricorrente (o nel debito collegato) e si aggiornano da soli budget, debito e piano.'],
    ['Come ne aggiungo uno?', '<b>Impostazioni → Pagamenti ricorrenti → + Aggiungi ricorrente</b> (o 🔁 in Movimenti). Oppure, quando registri una spesa, spunta <b>Si ripete ogni mese</b>: diventa ricorrente dal mese dopo.'],
    ['E se l\u2019importo cambia ogni mese?', 'Spunta <b>Importo variabile</b>. Quel giorno non si registra da solo: compare in Home sotto <b>Da fare</b> con l\u2019importo previsto, che puoi correggere prima di registrare.'],
    ['E luce e gas?', 'Non sono ricorrenti: quando arriva la bolletta la registri come uscita sulla voce <b>Bollette</b>. La voce compare solo in quel mese, con l\u2019importo vero, e non sfora mai: quel mese scende il salvadanaio debiti. Nei mesi senza bollette la voce non si vede. Il piano debiti, per i mesi futuri, conta una media (all\u2019inizio 105 € al mese, poi la vostra media vera).'],
    ['Ho già pagato un ricorrente prima del giorno previsto: come lo registro?', 'In <b>Movimenti</b> tocca la riga <b>🔜 In arrivo questo mese</b>, poi il pagamento → <b>✓ Pagato adesso</b>. I bonifici tuoi li trovi anche in Home → Da fare. Si registra con la data di oggi e il giorno previsto non viene ripetuto. Per quelli variabili (quote, stipendio) confermi l\u2019importo vero. Non usare ＋ Registra: verrebbe registrato due volte.'],
    ['Come salto un mese?', 'Con la ✕ in <b>Da fare</b>, oppure eliminando il movimento già creato: l\u2019app ti chiede <b>Salta questo mese</b> e i mesi successivi restano.'],
    ['Posso automatizzare il versamento nel fondo casa?', 'Sì: crea un ricorrente <b>Trasferimento</b> verso Fondo casa e spunta <b>Importo automatico</b>. Ogni mese verserà quello che avanza dal budget del mese.'],
    ['Si registrano anche se nessuno apre l\u2019app?', 'Si registrano la prima volta che uno di voi apre l\u2019app dopo il giorno stabilito, con la data giusta. Vale per il mese in corso: se per un mese intero nessuno la apre, quelli di quel mese vanno aggiunti a mano.']
  ]],
  ['Saldi e conti', [
    ['Dove vedo i saldi?', 'In Home, riquadro <b>Saldi</b>: totale e saldo di ogni conto. Con <b>Dettaglio</b> vedi per ogni conto quanto è entrato e uscito nel mese e gli ultimi movimenti.'],
    ['Come nascondo un conto dal totale?', 'Tocca l\u2019<b>occhio</b> accanto al conto: il saldo diventa ••••• e non conta più nel totale. Ritocca l\u2019occhio per rimetterlo. La scelta vale per entrambi i telefoni.'],
    ['A cosa servono i soldi di ogni conto?', 'Lo decidete voi: <b>Impostazioni → A cosa servono i conti</b>. Per ogni conto: se si usa per chiudere i debiti, se conta come riserva e la protezione (libero, con una parola da scrivere, bloccato; sempre o solo dopo i debiti). Per ogni bene: solo patrimonio, riserva per super emergenze, riserva, o da vendere per i debiti. Dopo ogni scelta l\u2019app ti mostra cosa cambia nel piano.'],
    ['Come cambio la quota di {QN}?', 'Impostazioni → <b>Quota di {QN}</b>: la percentuale sulle entrate fisse (diventa il budget intoccabile e il bonifico del mese) e quella sulle entrate extra (oggi {QX}). Puoi cambiare anche il nome.'],
    ['Come cambio l\u2019ordine dei debiti?', 'Impostazioni → <b>Ordine dei debiti</b>: rata più alta, tasso più alto o residuo più piccolo. Prima vengono sempre i debiti con una data. Ti mostra subito come cambiano le date.'],
    ['Come aggiungo, rinomino o elimino un conto?', '<b>Impostazioni → Conti</b>. Puoi aggiungere conti (anche “Contanti”), rinominarli e correggere il saldo. Un conto con movimenti non si elimina: si nasconde. Il Fondo casa è fisso.']
  ]],
  ['Obiettivi', [
    ['Cos\u2019è l\u2019ordine di attacco?', 'La sequenza del piano. Prima i debiti con una data promessa (verso una persona) e quelli a cui hai messo una data per saldarli, in ordine di data. Poi gli altri: {ORD} Si cambia in Impostazioni → Ordine dei debiti. I debiti verso persone senza data vengono per ultimi. Chiusi i debiti parte il fondo per l\u2019appartamento.'],
    ['Il residuo dei debiti si aggiorna da solo?', 'Sì: quando parte la rata collegata (Aggiorna → Rata ricorrente collegata) il residuo scende della quota di capitale, calcolata con il TAEG. Quando arriva a zero la rata si ferma e il budget si riduce. Se la banca ti dà un residuo diverso, scrivilo in Aggiorna: si riparte da lì.'],
    ['Come segue l\u2019app i debiti?', 'Niente extra mensili: paghi la rata e intanto metti da parte, poi saldi tutto in un colpo. Ogni euro libero va ai debiti: salvadanaio (la quota che dopo andrà al fondo casa), rate liberate, avanzi, entrate in arrivo ogni anno, conto (tolto il cuscinetto) e cassaforte. Mai il fondo casa. L\u2019ordine:<ol><li><b>Debiti verso persone con una data</b>: è una promessa, vengono prima di tutto e i soldi si tengono da parte.</li><li><b>Finanziamenti</b>: prima quelli con una data che desideri, in ordine di data; poi gli altri, prima l\u2019importo più basso (si chiude prima), a parità quello con più interessi. Ognuno si salda appena si può, purché restino i soldi per le date promesse.</li><li><b>Debiti verso persone senza data</b>: per ultimi.</li></ol>Se la data che desideri non è fattibile l\u2019app ti dice quella possibile; se entrano soldi e la data si avvicina, o diventa <b>saldabile ora</b>, te lo dice in Home.'],
    ['Come aggiorno un debito?', 'Obiettivi → <b>Aggiorna residuo</b>: scrivi il residuo che vedi nell\u2019app della banca. <b>Bonifico mensile</b> è quello che versi (lo usa il budget e il pagamento ricorrente); <b>Rata della banca</b> è quella vera del piano di ammortamento: il residuo scende di quella. Le date si ricalcolano.'],
    ['Posso pagare un po\u2019 in più sui finanziamenti?', 'No: niente extra mensili. Paghi la rata, i soldi restano sul conto e saldi tutto in un colpo con <b>🏛️ Salda ora</b> quando il piano dice “saldabile ora”. Solo sui debiti verso una persona puoi <b>restituire una parte</b>.'],
    ['Come creo un nuovo obiettivo?', 'Obiettivi → <b>+ Nuovo obiettivo</b>: prima scegli che cosa è (mutuo, finanziamento, carta, debito con una persona, risparmio), poi qual è l’obiettivo. <b>Risparmio</b>: cifra da raggiungere, crea anche il suo conto e ti dice quando ci arrivi. <b>Debito da chiudere</b>: residuo, rata e extra. Gli obiettivi si rinominano ed eliminano da Modifica/Aggiorna.'],

function faqHTML(q) {

function tourTarget(st) { if (!st.sel) return null; const t = $(st.sel); if (!t) return null; const r = t.getBoundingClientRect(); return r.width > 2 && r.height > 2 ? t : null; }
function tourShow(i, dir) {

}
function tourDraw() {
  const el = $('#tour'); if (!el) return; const st = TOUR.steps[TOUR.i], n = TOUR.steps.length;

function tourPlace() {
  const el = $('#tour'); if (!el || !TOUR.on) return; const st = TOUR.steps[TOUR.i], card = $('.tr-card', el), hole = $('.tr-hole', el), t = tourTarget(st);
  const W = innerWidth, H = innerHeight, cw = Math.min(400, W - 24); card.style.width = cw + 'px';
  const ch = card.offsetHeight;
  if (!t) { hole.classList.add('none'); hole.style.cssText = ''; card.style.left = Math.round((W - cw) / 2) + 'px'; card.style.top = Math.round(Math.max(16, (H - ch) / 2)) + 'px'; return; }
  hole.classList.remove('none');
  const r = t.getBoundingClientRect(), pad = 8;
  const top = Math.max(6, r.top - pad), bot = Math.min(H - 6, r.bottom + pad), left = Math.max(6, r.left - pad), right = Math.min(W - 6, r.right + pad);
  hole.style.cssText = `left:${left}px;top:${top}px;width:${right - left}px;height:${bot - top}px`;
  let y = bot + 12 + ch < H - 8 ? bot + 12 : top - 12 - ch > 8 ? top - 12 - ch : H - ch - 12;
  let x = Math.min(Math.max(12, (left + right) / 2 - cw / 2), W - cw - 12);
  card.style.left = Math.round(x) + 'px'; card.style.top = Math.round(Math.max(8, y)) + 'px';
}

function promptSheet(title, sub, okLabel, val) {

async function decideWait(id, ok, note) {

  const r = reportData(ym), d = r.pOut > 0 ? r2((r.out - r.pOut) / r.pOut * 100) : null;
  const w = openSheet(`<div id="report-print"><h3 class="sh-title">📄 ${esc(ymLabel(ym))}</h3><p class="sh-sub">Il resoconto del mese${ym === curYM() ? ' (ancora in corso)' : ''} · ${r.n} movimenti</p>
    <div class="mtiles" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:6px 0 12px">${[['Entrate', r.inc, 'g'], ['Uscite', r.out, 'o'], [r.net >= 0 ? 'Avanzano' : 'Mancano', Math.abs(r.net), r.net >= 0 ? 'g' : 'r']].map(([k, v, c]) => `<div class="card tight" style="margin:0;padding:10px;text-align:center"><div class="muted" style="font-size:12px">${k}</div><b class="num ${c}" style="font-size:15px">${eur(v)}</b></div>`).join('')}</div>
    ${d !== null ? `<div class="vrule">${d <= 0 ? '📉' : '📈'} Hai speso il <b>${Math.abs(d)}% ${d <= 0 ? 'in meno' : 'in più'}</b> di ${ymLabel(addMonths(ym, -1)).toLowerCase()} (${eur(r.pOut)}).</div>` : ''}
    ${r.debtPaid || r.toFund ? `<div class="vrule" style="margin-top:8px">${r.debtPaid ? `🏛️ Ai debiti: <b>${eur(r.debtPaid)}</b>` : ''}${r.debtPaid && r.toFund ? '<br>' : ''}${r.toFund ? `🔐 Messi da parte: <b>${eur(r.toFund)}</b>` : ''}</div>` : ''}
    ${r.over.length ? `<div class="h-label" style="margin-top:12px">Dove hai sforato</div>${r.over.map(o => `<div class="pr" style="display:flex;justify-content:space-between;padding:4px 0;font-size:14px"><span>${esc(o.e)} ${esc(o.n)}</span><b class="num r">+${eur(o.by)}</b></div>`).join('')}` : `<div class="vrule" style="margin-top:8px">✓ Nessuna voce sforata.</div>`}
    ${r.under.length ? `<div class="h-label" style="margin-top:12px">Dove hai risparmiato</div>${r.under.slice(0, 5).map(o => `<div class="pr" style="display:flex;justify-content:space-between;padding:4px 0;font-size:14px"><span>${esc(o.e)} ${esc(o.n)}</span><b class="num g">${eur(o.left)}</b></div>`).join('')}` : ''}
    ${r.top.length ? `<div class="h-label" style="margin-top:12px">Le spese più grandi</div>${r.top.map(t => `<div class="pr" style="display:flex;justify-content:space-between;padding:4px 0;font-size:14px"><span>${esc(t.note || catName(t))} · ${esc(dateShort(t.d))}</span><b class="num">${eur(t.a)}</b></div>`).join('')}` : ''}
    ${r.byWho.length ? `<div class="h-label" style="margin-top:12px">Chi ha speso</div>${r.byWho.map(x => `<div class="pr" style="display:flex;justify-content:space-between;padding:4px 0;font-size:14px"><span>${esc(x.p)}</span><b class="num">${eur(x.out)}</b></div>`).join('')}` : ''}</div>
    <div class="row2" style="margin-top:14px"><button class="btn mt0" data-rp="share">Condividi</button><button class="btn mt0" data-rp="print">Stampa / PDF</button></div>
    <div class="row2" style="margin-top:8px"><button class="btn ghost mt0" data-rp="prev">‹ Mese prima</button><button class="btn ghost mt0" data-rp="next" ${ym >= curYM() ? 'disabled' : ''}>Mese dopo ›</button></div>`);
  w.addEventListener('click', async e => {
    const b = e.target.closest('[data-rp]'); if (!b) return;
    if (b.dataset.rp === 'share') { const t = reportText(r); if (navigator.share) { try { await navigator.share({title: 'Future · ' + ymLabel(ym), text: t}); } catch (err) {} } else { try { await navigator.clipboard.writeText(t); toast('Resoconto copiato ✓'); } catch (err) {} } return; }
    if (b.dataset.rp === 'print') { document.body.classList.add('printing-report'); setTimeout(() => { window.print(); setTimeout(() => document.body.classList.remove('printing-report'), 500); }, 50); return; }
    closeSheet(w); openReport(addMonths(ym, b.dataset.rp === 'prev' ? -1 : 1));
  });
}
function handleReportParam() { try { const u = new URL(location.href), m = u.searchParams.get('report'); if (!m) return; u.searchParams.delete('report'); history.replaceState(null, '', u.pathname + (u.search || '') + u.hash); if (/^\d{4}-\d{2}$/.test(m)) setTimeout(() => openReport(m), 700); } catch (e) {} }

boot();
})();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
